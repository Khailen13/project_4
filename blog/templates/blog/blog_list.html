{% extends 'blog/base.html' %}
{% block title %}Главная{% endblock %}
{% load blog_tags %}
{% block content %}
{% include 'blog/menu.html' %}
<div class="row row-cols-md-3 g-4 m-5">
    {% for blog in object_list %}
    <div class="col d-flex flex-wrap align-items-stretch">
        <div class="card p-3">
            <div class="embed-responsive embed-responsive-16by9 text-center">
                <img src="{{blog.preview | media_filter}}" class="img-fluid" style="height: 20rem;" alt="Изображение">
            </div>
            <h4 class="text-dark mt-3"><strong>{{ blog.title }}</strong>
            </h4>
            <a class="btn btn-dark mt-3 mb-3 btn-lg" href="{% url 'blog:blog_detail' blog.pk %}" role="button">Посмотреть</a>
            <div class="row mt-2">
                <div class="col-6">
                    <p class="card-text text-dark fs-5">
                        <i class="bi bi-eye-fill"></i> {{ blog.views_count }}
                    </p>
                </div>
                <div class="col-6">
                    <p class="card-text text-end fs-5 "><small class="text-body-secondary ">
                        Добавлено: {{blog.created_at|date:"d M Y"}}
                    </small>
                    </p>
                </div>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
