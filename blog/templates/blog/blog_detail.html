{% extends 'blog/base.html' %}
{% block title %}{{ object.name }}{% endblock %}
{% load blog_tags %}
{% block content %}
{% include 'blog/menu.html' %}
<div class="container mt-5">
    <a class="btn btn-outline-dark mb-3" href="{% url 'blog:blog_list' %}" role="button"><strong>Все блоги</strong></a>
    <div class="card mb-3 p-3">
        <h3 class="card-title text-dark">{{ object.title }}</h3>
        <div class="row g-0 mt-3 mb-3">
            <div class="col-md-4 align-self-center">
                <img src="{{blog.preview | media_filter}}" class="img-fluid rounded-start" alt="Изображение">
            </div>
            <div class="col-md-8">
                <div class="card-body p-3 ">
                    <p class="card-text">{{ object.content }}</p>
                </div>
            </div>
        </div>
        <div class="row g-0 mt-3">
            <div class="col-6">
                <p class="card-text fs-5 text-dark">
                    <i class="bi bi-eye-fill"></i> {{ object.views_count }}
                </p>
                <p class="card-text fs-5"><small class="text-body-secondary">
                    Добавлено: {{ object.created_at|date:"d M Y" }}
                </small>
                </p>
            </div>
            <div class="col-6 mt-auto">
                <div class="row">
                    <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                        <a class="btn btn-outline-dark btn-lg " href="{% url 'blog:blog_update' blog.pk %}"
                           role="button"><i class="bi bi-wrench"></i></a>
                        <a class="btn btn-outline-dark btn-lg" href="{% url 'blog:blog_delete' blog.pk %}"
                           role="button"><i class="bi bi-trash"></i></a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
