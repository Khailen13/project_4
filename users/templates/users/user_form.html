{% extends 'catalog/base.html' %}
{% block title %}Регистрация{% endblock %}
{% block content %}
{% include 'catalog/menu.html' %}
<div class="container mt-5">
    <form class="row" method="post">
        <div class="col-6">
            <div class="card">
                <div class="card-body">
                    <p class="text-primary fs-5"> Заполните поля для регистрации </p>
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-primary ">
                        Регистрация
                    </button>
                </div>
            </div>
        </div>
    </form>
</div>
{% endblock %}
