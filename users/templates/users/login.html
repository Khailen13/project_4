{% extends 'catalog/base.html' %}
{% block title %}Вход{% endblock %}
{% block content %}
{% include 'catalog/menu.html' %}
<div class="container mt-5">
    <form class="row" method="post">
        <div class="col-6 ">
            <div class="card ">
                <div class="card-body ">
                    <p class="text-primary fs-5"> Введите данные для входа </p>
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-primary ">
                        Войти
                    </button>
                </div>
            </div>
        </div>
    </form>
</div>
{% endblock %}
