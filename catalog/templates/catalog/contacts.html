{% extends 'catalog/base.html' %}
{% block title %}Контакты{% endblock %}
{% block content %}
{% include 'catalog/menu.html' %}
<div class="container mt-5">
    <p class="my-0 text-primary fs-2 text-weight-normal">Контакты</p>
    <div class="row text-start">
        <div class="col-lg-9 col-md-6 col-sm-12">
            <div class="card mb-4 box-shadow">
                <div class="card-body">
                    <table class="table table-striped">
                        <tr>
                            <td class="w-25">Адрес</td>
                            <td>---------------</td>
                        </tr>
                        <tr>
                            <td class="w-25">ИНН</td>
                            <td>---------------</td>
                        </tr>
                        <tr>
                            <td class="w-25">E-mail</td>
                            <td>---------------</td>
                        </tr>
                        <tr>
                            <td class="w-25">Телефон горячей линии</td>
                            <td>---------------</td>
                        </tr>
                    </table>
                </div>
            </div>
        </div>
        <div class="col-lg-3 col-md-6 col-sm-12">
            <div class="card mb-4 box-shadow">
                <div class="card-header">
                    <h4 class="my-0 fs-4 text-primary">Свяжитесь с нами</h4>
                </div>
                <div class="card-body">
                    <form method="post" action="" class="form-floating">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="name">Имя</label>
                            <input type="text" name="name" class="form-control" id="name" placeholder="Ваше имя"
                                   required>
                        </div>
                        <div class="mb-3">
                            <label for="phone">Телефон</label>
                            <input type="text" name="phone" class="form-control" id="phone"
                                   placeholder="Контактный телефон" required>
                        </div>
                        <div class="mb-3">
                            <label for="message">Сообщение</label>
                            <textarea type="text" name="message" class="form-control" id="message"
                                      placeholder="Контактный телефон" required></textarea>
                        </div>
                        <button type="submit" class="btn btn-block btn-outline-primary"><strong>Отправить</strong>
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
